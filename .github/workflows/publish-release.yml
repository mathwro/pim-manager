name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing validated draft tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    outputs:
      draft: ${{ steps.release.outputs.draft }}
    steps:
      - name: Check out exact tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate immutable draft
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git cat-file -t "refs/tags/$tag")" = tag
          test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          release_json="$(gh release view "$tag" --repo '${{ github.repository }}' --json isDraft,tagName)"
          test "$(jq -r .tagName <<<"$release_json")" = "$tag"
          echo "draft=$(jq -r .isDraft <<<"$release_json")" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download draft assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          gh release download '${{ inputs.tag }}' --repo '${{ github.repository }}' --dir dist
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Recompute and verify complete assets
        run: go run ./release verify -version '${{ steps.release.outputs.version }}' -dir dist
      - name: Publish immutable release
        if: steps.release.outputs.draft == 'true'
        run: gh release edit '${{ inputs.tag }}' --repo '${{ github.repository }}' --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}

  notify-distribution:
    needs: verify-and-publish
    runs-on: ubuntu-24.04
    environment: distribution
    steps:
      - name: Check out exact tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.tag }}
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Dispatch unified package update
        shell: bash
        run: |
          set -euo pipefail
          repository="$(go run ./release metadata -field distributionRepository)"
          event="$(go run ./release metadata -field distributionEvent)"
          gh api --method POST "repos/$repository/dispatches" \
            -f "event_type=$event" \
            -f "client_payload[owner]=${{ github.repository_owner }}" \
            -f "client_payload[repository]=${{ github.event.repository.name }}" \
            -f "client_payload[tag]=${{ inputs.tag }}" \
            -f "client_payload[package]=pim-manager"
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_DISPATCH_TOKEN }}
